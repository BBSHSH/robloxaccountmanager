<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Roblox Local Manager</title><link rel="stylesheet" href="style.css" /></head>
<body><main>
  <header><div><p class="eyebrow">LOCAL • ENCRYPTED • NO SYNC</p><h1>Roblox Account Manager</h1><p class="subtitle">あなたが管理するCookieをWindows暗号化でローカル保存し、公式Robloxだけに接続します。</p></div><button id="verify-all" class="ghost">全アカウントを確認</button></header>
  <section class="safety"><strong>外部サーバーへ送信しません。</strong> CookieはWindows DPAPIで暗号化され、画面へ再表示・ログ出力・Git管理されません。ログイン確認とプロフィール表示は公式Roblox APIのみを使用します。</section>
  <section class="bulk"><label>全アカウントで開くゲームID <input id="bulk-game" inputmode="numeric" placeholder="空欄ならRobloxホームを開く" /></label><button id="open-all" class="primary">Cookie登録済みをまとめて開く</button></section>
  <section class="toolbar"><div><h2>アカウント</h2><span id="account-count"></span></div><button id="open-add" class="primary">＋ アカウントを追加</button></section>
  <section id="accounts" class="accounts" aria-live="polite"></section>
</main>
<dialog id="account-dialog"><form id="account-form" method="dialog"><div class="dialog-title"><h2>アカウントを追加</h2><button type="button" class="icon-button" data-close="account-dialog">×</button></div><label>表示名<input id="name" maxlength="48" placeholder="例: Main" required /></label><label>Robloxユーザー名 <span>任意</span><input id="username" maxlength="64" placeholder="例: Builderman" /></label><label>メモ <span>任意</span><textarea id="note" maxlength="280" placeholder="例: トレード用"></textarea></label><div class="dialog-actions"><button type="button" class="ghost" data-close="account-dialog">キャンセル</button><button class="primary">追加する</button></div></form></dialog>
<dialog id="cookie-dialog"><form id="cookie-form" method="dialog"><div class="dialog-title"><h2 id="cookie-title">Cookieを登録</h2><button type="button" class="icon-button" data-close="cookie-dialog">×</button></div><label>.ROBLOSECURITY<input id="cookie-value" type="password" autocomplete="off" spellcheck="false" placeholder="自分で管理しているCookieを貼り付け" required /></label><p class="hint">値は送信・再表示されず、Windows DPAPIで暗号化してこのPCだけに保存します。</p><div class="dialog-actions"><button type="button" class="ghost" data-close="cookie-dialog">キャンセル</button><button class="primary">暗号化して保存</button></div></form></dialog>
<div id="toast" role="status"></div><script src="renderer.js"></script></body></html>
