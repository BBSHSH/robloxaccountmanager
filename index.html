<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Local Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">LOCAL • ENCRYPTED • NO SYNC</p>
      <h1>Roblox Account Manager</h1>
      <p class="subtitle">公式ログインするだけでCookieを自動取得し、Windows暗号化で安全にローカル保存します。</p>
    </div>
    <button id="verify-all" class="ghost">全アカウントを確認</button>
  </header>

  <section class="safety">
    <strong>外部サーバーへ送信しません。</strong> 取得したCookieはWindows DPAPIで暗号化され、このPC内だけで安全に管理されます。
  </section>

  <section class="bulk">
    <label>全アカウントで開くゲームID <input id="bulk-game" inputmode="numeric" placeholder="空欄ならRobloxホームを開く" /></label>
    <button id="open-all" class="primary">ログイン済みをまとめて開く</button>
  </section>

  <section class="toolbar">
    <div>
      <h2>アカウント</h2>
      <span id="account-count"></span>
    </div>
    <button id="open-add" class="primary">＋ アカウントを追加</button>
  </section>

  <section id="accounts" class="accounts" aria-live="polite"></section>
</main>

<!-- アカウント追加ダイアログ（シンプルに名前・メモだけ） -->
<dialog id="account-dialog">
  <form id="account-form" method="dialog">
    <div class="dialog-title">
      <h2>アカウントを追加</h2>
      <button type="button" class="icon-button" data-close="account-dialog">×</button>
    </div>
    <label>表示名<input id="name" maxlength="48" placeholder="例: メイン垢" required /></label>
    <label>Robloxユーザー名 <span>任意</span><input id="username" maxlength="64" placeholder="例: Builderman" /></label>
    <label>メモ <span>任意</span><textarea id="note" maxlength="280" placeholder="例: トレード用 / サブ垢"></textarea></label>
    <p class="hint">追加後に「公式ログイン」ボタンからログインするだけで、Cookieが自動保存されます。</p>
    <div class="dialog-actions">
      <button type="button" class="ghost" data-close="account-dialog">キャンセル</button>
      <button class="primary">追加する</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="renderer.js"></script>
</body>
</html>
